name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: smoke-run the demo
        run: argus-demo --planner info-rate --seed 0
      - name: quick benchmark (10 seeds) to catch regressions in the pipeline
        run: python experiments/run_benchmark.py --seeds 10 --workers 2
      - name: quick decoy benchmark (v1.1) to catch regressions in the decision pipeline
        run: python experiments/run_decoy_benchmark.py --quick --workers 2
      - name: quick decoy benchmark, milestone (ii)
        run: python experiments/run_decoy_benchmark_ii.py --quick --workers 2
      - name: quick threshold sweep, milestone (iii)
        run: |
          python experiments/run_sweep.py --split select --quick --workers 2
          cd experiments && python analyse_sweep.py --split select --quick > /dev/null
      - name: FIRMS 2024 real-data analysis
        run: cd experiments && python firms_contact.py > /dev/null
      - name: quick v1.2 sweep on screening seeds
        run: cd experiments && python v12.py sweep --quick --workers 2 && python v12.py select --quick > /dev/null
      - name: object-level H1 smoke run
        run: python -c "from argus_autonomy import NOMINAL; from argus_autonomy.config import SPRTConfig; from argus_autonomy.decision import run_decision_mission as r; print(r(NOMINAL,'M3','A',5000,sprt=SPRTConfig(steer_clear=-4.595,h1_model='object')).decision)"
