name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: smoke-run the demo
        run: argus-demo --planner info-rate --seed 0
      - name: quick benchmark (10 seeds) to catch regressions in the pipeline
        run: python experiments/run_benchmark.py --seeds 10 --workers 2
